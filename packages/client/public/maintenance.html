<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Createrington — Under Maintenance</title>
    <style>
      *,
      *::before,
      *::after {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      :root {
        --bg: oklch(0.17 0.0075 285.942);
        --card: oklch(0.21 0.01 285.885);
        --fg: oklch(0.985 0.002 285.885);
        --muted: oklch(0.707 0.008 285.885);
        --accent: oklch(0.278 0.012 285.885);
        --border: oklch(1 0 0 / 10%);
        --primary: oklch(82.8% 0.189 84.429);
        --radius: 0.75rem;
      }

      body {
        font-family:
          -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica,
          Arial, sans-serif;
        background: var(--bg);
        color: var(--fg);
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 1.5rem;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
        user-select: none;
      }

      .card {
        width: 100%;
        max-width: 36rem;
        border: 1px solid var(--border);
        border-radius: var(--radius);
        background: color-mix(in oklch, var(--card) 60%, transparent);
        backdrop-filter: blur(12px);
        -webkit-backdrop-filter: blur(12px);
        overflow: hidden;
      }

      .card-header {
        padding: 1.5rem 1.5rem 0;
        display: flex;
        flex-direction: column;
        gap: 0.75rem;
      }

      .card-content {
        padding: 1rem 1.5rem 1.5rem;
      }

      .header-row {
        display: flex;
        align-items: center;
        gap: 0.5rem;
      }

      .icon-box {
        flex-shrink: 0;
        width: 2.5rem;
        height: 2.5rem;
        display: flex;
        align-items: center;
        justify-content: center;
        border-radius: 0.5rem;
        background: var(--accent);
      }

      .icon-box svg {
        width: 1.25rem;
        height: 1.25rem;
        color: var(--muted);
        animation: pulse 3s ease-in-out infinite;
      }

      @keyframes pulse {
        0%,
        100% {
          opacity: 0.6;
          transform: scale(1);
        }
        50% {
          opacity: 1;
          transform: scale(1.08);
        }
      }

      .header-text {
        min-width: 0;
      }

      .title-row {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 0.5rem;
      }

      h1 {
        font-size: 1.125rem;
        font-weight: 600;
        line-height: 1.4;
      }

      .badge {
        display: inline-flex;
        align-items: center;
        padding: 0.125rem 0.5rem;
        font-size: 0.75rem;
        font-weight: 500;
        line-height: 1.4;
        border: 1px solid var(--border);
        border-radius: 9999px;
        color: var(--primary);
      }

      .subtitle {
        font-size: 0.875rem;
        color: var(--muted);
        line-height: 1.5;
      }

      .status-bar {
        border-radius: 0.5rem;
        border: 1px solid var(--border);
        background: color-mix(in oklch, var(--accent) 40%, transparent);
        padding: 0.75rem;
        display: flex;
        align-items: center;
        gap: 0.625rem;
      }

      .status-dot {
        flex-shrink: 0;
        width: 0.5rem;
        height: 0.5rem;
        border-radius: 9999px;
        background: var(--primary);
        animation: blink 2s ease-in-out infinite;
      }

      @keyframes blink {
        0%,
        100% {
          opacity: 1;
        }
        50% {
          opacity: 0.3;
        }
      }

      .status-text {
        font-size: 0.8125rem;
        color: var(--muted);
      }

      .actions {
        display: grid;
        gap: 0.75rem;
      }

      @media (min-width: 640px) {
        .actions {
          grid-template-columns: 1fr 1fr;
        }
      }

      .action-btn {
        display: flex;
        align-items: center;
        gap: 0.75rem;
        border-radius: 0.5rem;
        border: 1px solid var(--border);
        background: color-mix(in oklch, var(--bg) 40%, transparent);
        padding: 0.75rem;
        text-align: left;
        cursor: pointer;
        color: inherit;
        font: inherit;
        transition: background 0.15s;
        text-decoration: none;
      }

      .action-btn:hover {
        background: color-mix(in oklch, var(--accent) 30%, transparent);
      }

      .action-icon {
        flex-shrink: 0;
        width: 2.25rem;
        height: 2.25rem;
        display: flex;
        align-items: center;
        justify-content: center;
        border-radius: 0.375rem;
        background: var(--accent);
      }

      .action-icon svg {
        width: 1rem;
        height: 1rem;
        color: var(--muted);
        transition: color 0.15s;
      }

      .action-btn:hover .action-icon svg {
        color: var(--fg);
      }

      .action-label {
        font-size: 0.875rem;
        font-weight: 500;
      }

      .action-desc {
        font-size: 0.75rem;
        color: var(--muted);
      }
    </style>
  </head>
  <body>
    <div class="card">
      <div class="card-header">
        <div class="header-row">
          <div class="icon-box">
            <!-- wrench icon -->
            <svg
              xmlns="http://www.w3.org/2000/svg"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
            >
              <path
                d="M14.7 6.3a1 1 0 0 0 0 1.4l1.6 1.6a1 1 0 0 0 1.4 0l3.77-3.77a6 6 0 0 1-7.94 7.94l-6.91 6.91a2.12 2.12 0 0 1-3-3l6.91-6.91a6 6 0 0 1 7.94-7.94l-3.76 3.76z"
              />
            </svg>
          </div>
          <div class="header-text">
            <div class="title-row">
              <h1>Under Maintenance</h1>
              <span class="badge">Deploying</span>
            </div>
            <p class="subtitle">
              We're updating things behind the scenes. We'll be back shortly.
            </p>
          </div>
        </div>

        <div class="status-bar">
          <span class="status-dot"></span>
          <span class="status-text"
            >A new version is being deployed — this usually takes less than a
            minute.</span
          >
        </div>
      </div>

      <div class="card-content">
        <div class="actions">
          <button class="action-btn" onclick="location.reload()">
            <div class="action-icon">
              <!-- refresh icon -->
              <svg
                xmlns="http://www.w3.org/2000/svg"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
                stroke-linecap="round"
                stroke-linejoin="round"
              >
                <path d="M21 12a9 9 0 1 1-9-9c2.52 0 4.93 1 6.74 2.74L21 8" />
                <path d="M21 3v5h-5" />
              </svg>
            </div>
            <div>
              <p class="action-label">Refresh</p>
              <p class="action-desc">Check if we're back online</p>
            </div>
          </button>

          <a class="action-btn" href="https://discord.gg/mtF6MDHj4Z">
            <div class="action-icon">
              <!-- message-circle icon -->
              <svg
                xmlns="http://www.w3.org/2000/svg"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
                stroke-linecap="round"
                stroke-linejoin="round"
              >
                <path d="M7.9 20A9 9 0 1 0 4 16.1L2 22z" />
              </svg>
            </div>
            <div>
              <p class="action-label">Discord</p>
              <p class="action-desc">Check status on our server</p>
            </div>
          </a>
        </div>
      </div>
    </div>
  </body>
</html>
