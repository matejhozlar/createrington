<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#000000" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self' https://static.cloudflareinsights.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: blob: https:; connect-src 'self' https://cloudflareinsights.com wss: ws:; frame-src 'self' https://map.createrington.com;"
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600&display=swap"
      rel="stylesheet"
    />

    <link rel="icon" type="image/png" href="/assets/logo/logo.png" />
    <link rel="apple-touch-icon" href="/assets/logo/logo.png" />
    <link rel="canonical" href="https://createrington.com" />
    <title>Createrington</title>
    <meta
      name="description"
      content="The community portal for Createrington, a Create mod Minecraft server. Player profiles, a simulated crypto market, live chat, an interactive world map, and more."
    />

    <!-- Open Graph (for Discord, Facebook, etc.) -->
    <meta property="og:title" content="Createrington" />
    <meta
      property="og:description"
      content="The community portal for Createrington, a Create mod Minecraft server. Player profiles, a simulated crypto market, live chat, an interactive world map, and more."
    />
    <meta
      property="og:image"
      content="https://createrington.com/assets/og/og-card.png"
    />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:type" content="image/png" />
    <meta
      property="og:image:alt"
      content="Createrington — Build Big. Automate Everything. A Create-powered Minecraft server."
    />
    <meta property="og:url" content="https://createrington.com" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Createrington" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Createrington" />
    <meta
      name="twitter:description"
      content="The community portal for Createrington, a Create mod Minecraft server. Player profiles, a simulated crypto market, live chat, an interactive world map, and more."
    />
    <meta
      name="twitter:image"
      content="https://createrington.com/assets/og/og-card.png"
    />
    <meta
      name="twitter:image:alt"
      content="Createrington — Build Big. Automate Everything. A Create-powered Minecraft server."
    />
  </head>
  <body>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="root"></div>

    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
