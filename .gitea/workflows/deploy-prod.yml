name: Deploy Prod

on:
  pull_request:
    types: [closed]
    branches: [main]

jobs:
  deploy:
    if: github.event.pull_request.merged == true
    runs-on: hetzner
    env:
      INFISICAL_API_URL: ${{ secrets.INFISICAL_API_URL }}
      INFISICAL_PROJECT_ID: ${{ vars.INFISICAL_PROJECT_ID }}
      APP_DIR: ${{ vars.PROD_APP_DIR }}
      WWW_DIR: ${{ vars.PROD_WWW_DIR }}
      DEPLOY_OWNER: ${{ vars.DEPLOY_OWNER }}
      API_URL: ${{ vars.PROD_API_URL }}
      BLUEMAP_URL: ${{ vars.PROD_BLUEMAP_URL }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate deploy variables
        run: |
          : "${INFISICAL_PROJECT_ID:?}" "${APP_DIR:?}" "${WWW_DIR:?}" "${DEPLOY_OWNER:?}"
          : "${API_URL:?}" "${BLUEMAP_URL:?}"

      - name: Detect scope of change
        id: scope
        run: |
          BEFORE='${{ github.event.pull_request.base.sha }}'
          AFTER='${{ github.sha }}'
          if [ -z "$BEFORE" ] || [ "$BEFORE" = "0000000000000000000000000000000000000000" ]; then
            echo "client_only=false" >> "$GITHUB_OUTPUT"
            echo "No base SHA - running full deploy."
            exit 0
          fi
          if ! CHANGED=$(git diff --name-only "$BEFORE" "$AFTER" 2>/dev/null); then
            echo "client_only=false" >> "$GITHUB_OUTPUT"
            echo "Could not diff $BEFORE..$AFTER - running full deploy."
            exit 0
          fi
          if [ -z "$CHANGED" ]; then
            echo "client_only=false" >> "$GITHUB_OUTPUT"
            echo "Empty diff - running full deploy."
            exit 0
          fi
          NON_CLIENT=$(echo "$CHANGED" | grep -vE '^packages/client/' || true)
          if [ -z "$NON_CLIENT" ]; then
            echo "client_only=true" >> "$GITHUB_OUTPUT"
            echo "Client-only change detected - migrate + restart will be skipped."
            echo "Changed paths:"
            echo "$CHANGED"
          else
            echo "client_only=false" >> "$GITHUB_OUTPUT"
            echo "Non-client paths touched - running full deploy."
            echo "Server-side paths:"
            echo "$NON_CLIENT"
          fi

      - name: Install pnpm
        run: npm install -g pnpm

      - name: Install dependencies
        run: pnpm install

      - name: Login to Infisical
        env:
          INFISICAL_CLIENT_ID: ${{ secrets.INFISICAL_CLIENT_ID }}
          INFISICAL_CLIENT_SECRET: ${{ secrets.INFISICAL_CLIENT_SECRET }}
        run: |
          TOKEN=$(pnpm exec infisical login \
            --method=universal-auth \
            --client-id="$INFISICAL_CLIENT_ID" \
            --client-secret="$INFISICAL_CLIENT_SECRET" \
            --plain --silent)
          echo "INFISICAL_TOKEN=$TOKEN" >> "$GITHUB_ENV"

      - name: Scrape Discord entities, generate types, command docs, and deploy commands
        run: |
          pnpm exec infisical run --projectId="$INFISICAL_PROJECT_ID" --env=prod --command '
            export DB_HOST="$DEPLOY_DB_HOST"
            export DB_PORT="$DEPLOY_DB_PORT"
            pnpm scrape-discord
            pnpm generate:ci
            pnpm generate-command-docs:json
            pnpm generate-api-docs
            pnpm deploy-commands
          '

      - name: Resolve app version
        run: |
          VERSION="$(node -p 'require("./package.json").version')"
          echo "APP_VERSION=$VERSION" >> "$GITHUB_ENV"

      - name: Build
        env:
          VITE_APP_VERSION: ${{ env.APP_VERSION }}
          VITE_API_URL: ${{ env.API_URL }}
          VITE_BLUEMAP_URL: ${{ env.BLUEMAP_URL }}
        run: pnpm build

      - name: Deploy frontend
        run: |
          rm -rf "${WWW_DIR:?}"/*
          cp -r dist/public/* "$WWW_DIR/"

      - name: Deploy backend
        run: |
          rm -rf "${APP_DIR:?}/dist"
          cp -r dist "$APP_DIR/dist"
          cp package.json "$APP_DIR/package.json"
          rm -rf "${APP_DIR:?}/node_modules"
          cp -r node_modules "$APP_DIR/node_modules"
          mkdir -p "$APP_DIR/packages/server"
          rm -rf "${APP_DIR:?}/packages/server/node_modules"
          cp -r packages/server/node_modules "$APP_DIR/packages/server/node_modules"
          mkdir -p "$APP_DIR/docker/db"
          cp docker/db/claude-readonly-role.sql docker/db/sync-readonly-grants.sh "$APP_DIR/docker/db/"

      - name: Migrate database
        if: steps.scope.outputs.client_only != 'true'
        run: |
          pnpm exec infisical run --projectId="$INFISICAL_PROJECT_ID" --env=prod --command '
            export DB_HOST="$DEPLOY_DB_HOST"
            export DB_PORT="$DEPLOY_DB_PORT"
            export PGPASSWORD="$DB_PASSWORD"
            pnpm db:migrate
          '

      - name: Sync readonly role grants
        if: steps.scope.outputs.client_only != 'true'
        continue-on-error: true
        run: |
          command -v psql > /dev/null || { apt-get update > /dev/null && apt-get install -y postgresql-client > /dev/null; }
          pnpm exec infisical run --projectId="$INFISICAL_PROJECT_ID" --env=prod --command '
            export DB_HOST="$DEPLOY_DB_HOST"
            export DB_PORT="$DEPLOY_DB_PORT"
            export PGPASSWORD="$DB_PASSWORD"
            bash docker/db/sync-readonly-grants.sh
          '

      - name: Sync runtime .env from Infisical
        run: |
          pnpm exec infisical export --projectId="$INFISICAL_PROJECT_ID" --env=prod --format=dotenv > "$APP_DIR/.env"
          echo "APP_VERSION=$APP_VERSION" >> "$APP_DIR/.env"
          chmod 600 "$APP_DIR/.env"

      - name: Fix permissions and trigger restart
        run: |
          rm -f "$APP_DIR/.maintenance"
          chown -R "$DEPLOY_OWNER" "$APP_DIR"
          chown -R "$DEPLOY_OWNER" "$WWW_DIR"
          if [ '${{ steps.scope.outputs.client_only }}' = 'true' ]; then
            echo "Client-only deploy - skipping restart trigger."
          else
            touch "$APP_DIR/.restart-trigger"
          fi
