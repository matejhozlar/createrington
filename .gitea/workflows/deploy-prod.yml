name: Deploy Prod

on:
  pull_request:
    types: [closed]
    branches: [main]

jobs:
  deploy:
    if: github.event.pull_request.merged == true
    runs-on: hetzner
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect scope of change
        id: scope
        run: |
          BEFORE='${{ github.event.pull_request.base.sha }}'
          AFTER='${{ github.sha }}'
          if [ -z "$BEFORE" ] || [ "$BEFORE" = "0000000000000000000000000000000000000000" ]; then
            echo "client_only=false" >> "$GITHUB_OUTPUT"
            echo "No base SHA - running full deploy."
            exit 0
          fi
          if ! CHANGED=$(git diff --name-only "$BEFORE" "$AFTER" 2>/dev/null); then
            echo "client_only=false" >> "$GITHUB_OUTPUT"
            echo "Could not diff $BEFORE..$AFTER - running full deploy."
            exit 0
          fi
          if [ -z "$CHANGED" ]; then
            echo "client_only=false" >> "$GITHUB_OUTPUT"
            echo "Empty diff - running full deploy."
            exit 0
          fi
          NON_CLIENT=$(echo "$CHANGED" | grep -vE '^(packages/client/|marketing/)' || true)
          if [ -z "$NON_CLIENT" ]; then
            echo "client_only=true" >> "$GITHUB_OUTPUT"
            echo "Client-only change detected - migrate + restart will be skipped."
            echo "Changed paths:"
            echo "$CHANGED"
          else
            echo "client_only=false" >> "$GITHUB_OUTPUT"
            echo "Non-client paths touched - running full deploy."
            echo "Server-side paths:"
            echo "$NON_CLIENT"
          fi

      - name: Install pnpm
        run: npm install -g pnpm

      - name: Install dependencies
        run: pnpm install

      - name: Scrape Discord entities, generate types, command docs, and deploy commands
        run: |
          set -a
          source /opt/createrington/.env
          set +a
          export DB_HOST=infra-postgres
          export DB_PORT=5432
          pnpm scrape-discord
          pnpm generate:ci
          pnpm generate-command-docs:json
          pnpm generate-api-docs
          pnpm deploy-commands

      - name: Build
        run: VITE_API_URL=https://createrington.com VITE_BLUEMAP_URL=https://createrington.com/bluemap pnpm build

      - name: Deploy frontend
        run: |
          rm -rf /var/www/createrington/*
          cp -r dist/public/* /var/www/createrington/

      - name: Deploy backend
        run: |
          rm -rf /opt/createrington/dist
          cp -r dist /opt/createrington/dist
          cp package.json /opt/createrington/package.json
          rm -rf /opt/createrington/node_modules
          cp -r node_modules /opt/createrington/node_modules
          mkdir -p /opt/createrington/packages/server
          rm -rf /opt/createrington/packages/server/node_modules
          cp -r packages/server/node_modules /opt/createrington/packages/server/node_modules

      - name: Migrate database
        if: steps.scope.outputs.client_only != 'true'
        run: |
          export DB_HOST=infra-postgres
          export DB_PORT=5432
          export DB_USER=$(grep '^DB_USER=' /opt/createrington/.env | cut -d'=' -f2-)
          export DB_PASSWORD=$(grep '^DB_PASSWORD=' /opt/createrington/.env | cut -d'=' -f2-)
          export DB_DATABASE=$(grep '^DB_DATABASE=' /opt/createrington/.env | cut -d'=' -f2-)
          export PGPASSWORD=$DB_PASSWORD
          pnpm db:migrate

      - name: Fix permissions and trigger restart
        run: |
          rm -f /opt/createrington/.maintenance
          chown -R 1000:988 /opt/createrington
          chown -R 1000:988 /var/www/createrington
          if [ '${{ steps.scope.outputs.client_only }}' = 'true' ]; then
            echo "Client-only deploy - skipping restart trigger."
          else
            touch /opt/createrington/.restart-trigger
          fi
