name: CI

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
      - dev

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  HUSKY: "0"

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup
        uses: ./.gitea/actions/setup

      - name: Check formatting
        run: pnpm format:check

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup
        uses: ./.gitea/actions/setup

      - name: Lint
        run: pnpm lint

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup
        uses: ./.gitea/actions/setup

      - name: Generate code
        run: pnpm generate:ci

      - name: Type check
        run: pnpm typecheck

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup
        uses: ./.gitea/actions/setup

      - name: Generate code
        run: pnpm generate:ci

      - name: Build server
        run: pnpm build:server

      - name: Build client
        run: pnpm build:client

  test-unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup
        uses: ./.gitea/actions/setup

      - name: Generate code
        run: pnpm generate:ci

      - name: Run server unit tests
        run: pnpm --filter @createrington/server test:unit

  test-integration:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: createrington_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DB_HOST: localhost
      DB_PORT: "5432"
      DB_USER: postgres
      DB_PASSWORD: postgres
      DB_DATABASE: createrington_db
    steps:
      - uses: actions/checkout@v4

      - name: Setup
        uses: ./.gitea/actions/setup

      - name: Generate code
        run: pnpm generate:ci

      - name: Run migrations
        run: pnpm --filter @createrington/server db:migrate

      - name: Run server integration tests
        run: pnpm --filter @createrington/server test:integration

  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup
        uses: ./.gitea/actions/setup

      - name: Audit dependencies
        run: pnpm audit --audit-level=high
