name: Deploy Dev

on:
  pull_request:
    types: [closed]
    branches: [dev]
  workflow_dispatch:
    inputs:
      reset_db:
        description: "Reset the database (drop + recreate + seed)"
        required: false
        default: "false"
        type: choice
        options:
          - "false"
          - "true"

jobs:
  deploy:
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.merged == true
    runs-on: hetzner
    env:
      INFISICAL_API_URL: ${{ secrets.INFISICAL_API_URL }}
      INFISICAL_PROJECT_ID: ${{ vars.INFISICAL_PROJECT_ID }}
      APP_DIR: ${{ vars.DEV_APP_DIR }}
      WWW_DIR: ${{ vars.DEV_WWW_DIR }}
      DEPLOY_OWNER: ${{ vars.DEPLOY_OWNER }}
      MAVEN_REPO: ${{ vars.MAVEN_REPO }}
      NPM_REGISTRY: ${{ vars.NPM_REGISTRY }}
      API_URL: ${{ vars.DEV_API_URL }}
      BLUEMAP_URL: ${{ vars.DEV_BLUEMAP_URL }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate deploy variables
        run: |
          : "${INFISICAL_PROJECT_ID:?}" "${APP_DIR:?}" "${WWW_DIR:?}" "${DEPLOY_OWNER:?}"
          : "${MAVEN_REPO:?}" "${NPM_REGISTRY:?}" "${API_URL:?}" "${BLUEMAP_URL:?}"

      - name: Install pnpm
        run: npm install -g pnpm

      - name: Install dependencies
        run: pnpm install

      - name: Login to Infisical
        env:
          INFISICAL_CLIENT_ID: ${{ secrets.INFISICAL_CLIENT_ID }}
          INFISICAL_CLIENT_SECRET: ${{ secrets.INFISICAL_CLIENT_SECRET }}
        run: |
          TOKEN=$(pnpm exec infisical login \
            --method=universal-auth \
            --client-id="$INFISICAL_CLIENT_ID" \
            --client-secret="$INFISICAL_CLIENT_SECRET" \
            --plain --silent)
          echo "INFISICAL_TOKEN=$TOKEN" >> "$GITHUB_ENV"

      - name: Generate types, command docs, and deploy commands
        run: |
          pnpm exec infisical run --projectId="$INFISICAL_PROJECT_ID" --env=staging --command '
            export DB_HOST="$DEPLOY_DB_HOST"
            export DB_PORT="$DEPLOY_DB_PORT"
            pnpm generate:ci
            pnpm generate-command-docs:json
            pnpm generate-api-docs
            pnpm deploy-commands
          '

      - name: Check for mod API changes
        id: spec-check
        run: |
          changed=false
          VERSION=$(grep '^version=' mod-api/gradle.properties | cut -d'=' -f2)
          JAR_URL="https://raw.githubusercontent.com/${MAVEN_REPO}/main/com/saunhardy/createrington-api/${VERSION}/createrington-api-${VERSION}.jar"
          if curl --silent --head --fail "$JAR_URL" > /dev/null 2>&1; then
            echo "createrington-api:${VERSION} is already published."
          else
            echo "createrington-api:${VERSION} is not published yet, will publish."
            changed=true
          fi
          if [ "${{ github.event_name }}" = "pull_request" ] && git diff HEAD^1..HEAD --name-only -- '*.api-spec.ts' | grep -q .; then
            echo "Mod API spec files changed in this merge."
            changed=true
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "jar_url=$JAR_URL" >> "$GITHUB_OUTPUT"
          echo "changed=$changed" >> "$GITHUB_OUTPUT"

      - name: Setup JDK 21
        if: steps.spec-check.outputs.changed == 'true'
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: "temurin"

      - name: Setup Gradle
        if: steps.spec-check.outputs.changed == 'true'
        uses: gradle/actions/setup-gradle@v4.4.4
        with:
          gradle-version: "8.12"

      - name: Generate and publish mod API
        if: steps.spec-check.outputs.changed == 'true'
        env:
          VERSION: ${{ steps.spec-check.outputs.version }}
          JAR_URL: ${{ steps.spec-check.outputs.jar_url }}
          MAVEN_REPO_TOKEN: ${{ secrets.MAVEN_REPO_TOKEN }}
        run: |
          pnpm generate-mod-api
          cd mod-api
          if curl --silent --head --fail "$JAR_URL" > /dev/null 2>&1; then
            echo "ERROR: createrington-api:${VERSION} already published. Bump version in mod-api/gradle.properties"
            exit 1
          fi
          gradle publish
          cd ..
          git clone "https://x-access-token:${MAVEN_REPO_TOKEN}@github.com/${MAVEN_REPO}.git" maven-repo
          cp -r mod-api/build/maven-publish/. maven-repo/
          cd maven-repo
          git config user.email "ci@create-rington.com"
          git config user.name "CI"
          git add .
          git diff --cached --quiet || git commit -m "publish createrington-api ${VERSION}"
          git push

      - name: Resolve app version
        run: |
          VERSION="$(node -p 'require("./package.json").version')"
          SHA="$(git rev-parse --short HEAD)"
          echo "APP_VERSION=$VERSION-dev.$SHA" >> "$GITHUB_ENV"

      - name: Build
        env:
          VITE_APP_VERSION: ${{ env.APP_VERSION }}
          VITE_API_URL: ${{ env.API_URL }}
          VITE_BLUEMAP_URL: ${{ env.BLUEMAP_URL }}
          VITE_LAUNCHER_ENABLED: "true"
        run: pnpm build

      - name: Deploy frontend
        run: |
          rm -rf "${WWW_DIR:?}"/*
          cp -r dist/public/* "$WWW_DIR/"

      - name: Deploy backend
        run: |
          rm -rf "${APP_DIR:?}/dist"
          cp -r dist "$APP_DIR/dist"
          cp package.json "$APP_DIR/package.json"
          rm -rf "${APP_DIR:?}/node_modules"
          cp -r node_modules "$APP_DIR/node_modules"
          mkdir -p "$APP_DIR/packages/server"
          rm -rf "${APP_DIR:?}/packages/server/node_modules"
          cp -r packages/server/node_modules "$APP_DIR/packages/server/node_modules"
          mkdir -p "$APP_DIR/docker/db"
          cp docker/db/claude-readonly-role.sql docker/db/sync-readonly-grants.sh "$APP_DIR/docker/db/"

      - name: Migrate database
        if: ${{ github.event.inputs.reset_db != 'true' }}
        run: |
          pnpm exec infisical run --projectId="$INFISICAL_PROJECT_ID" --env=staging --command '
            export DB_HOST="$DEPLOY_DB_HOST"
            export DB_PORT="$DEPLOY_DB_PORT"
            export PGPASSWORD="$DB_PASSWORD"
            pnpm db:migrate
          '

      - name: Reset database
        if: ${{ github.event.inputs.reset_db == 'true' }}
        run: |
          command -v psql > /dev/null || { apt-get update > /dev/null && apt-get install -y postgresql-client > /dev/null; }
          pnpm exec infisical run --projectId="$INFISICAL_PROJECT_ID" --env=staging --command '
            export DB_HOST="$DEPLOY_DB_HOST"
            export DB_PORT="$DEPLOY_DB_PORT"
            export PGPORT="$DEPLOY_DB_PORT"
            export PGPASSWORD="$DB_PASSWORD"
            psql -h "$DB_HOST" -U "$DB_USER" -d postgres -c "DROP DATABASE IF EXISTS $DB_DATABASE WITH (FORCE);"
            psql -h "$DB_HOST" -U "$DB_USER" -d postgres -c "CREATE DATABASE $DB_DATABASE;"
            pnpm db:migrate
            psql -h "$DB_HOST" -U "$DB_USER" -d "$DB_DATABASE" -f docker/db/data/test-data.sql
          '

      - name: Sync readonly role grants
        continue-on-error: true
        run: |
          command -v psql > /dev/null || { apt-get update > /dev/null && apt-get install -y postgresql-client > /dev/null; }
          pnpm exec infisical run --projectId="$INFISICAL_PROJECT_ID" --env=staging --command '
            export DB_HOST="$DEPLOY_DB_HOST"
            export DB_PORT="$DEPLOY_DB_PORT"
            export PGPASSWORD="$DB_PASSWORD"
            bash docker/db/sync-readonly-grants.sh
          '

      - name: Sync runtime .env from Infisical
        run: |
          pnpm exec infisical export --projectId="$INFISICAL_PROJECT_ID" --env=staging --format=dotenv > "$APP_DIR/.env"
          echo "APP_VERSION=$APP_VERSION" >> "$APP_DIR/.env"
          chmod 600 "$APP_DIR/.env"

      - name: Fix permissions and trigger restart
        run: |
          rm -f "$APP_DIR/.maintenance"
          chown -R "$DEPLOY_OWNER" "$APP_DIR"
          chown -R "$DEPLOY_OWNER" "$WWW_DIR"
          touch "$APP_DIR/.restart-trigger"

      - name: Check if @createrington/api-types version changed
        id: api-types-check
        run: |
          REGISTRY="$NPM_REGISTRY"
          CURRENT=$(node -p "require('./packages/api-types/package.json').version")
          PUBLISHED=$(npm view @createrington/api-types@$CURRENT version --registry=$REGISTRY 2>/dev/null || echo "")
          if [ -n "$PUBLISHED" ]; then
            # The version is taken, so the built types must match the published
            # ones exactly; a drift means someone changed the contract without
            # bumping packages/api-types/package.json
            pnpm --filter @createrington/api-types build
            TARBALL=$(npm pack @createrington/api-types@$CURRENT --registry=$REGISTRY --silent)
            tar -xzf "$TARBALL" package/dist/index.d.ts
            if diff -q packages/api-types/dist/index.d.ts package/dist/index.d.ts > /dev/null; then
              echo "@createrington/api-types@$CURRENT already on Gitea with identical types, skipping publish"
              rm -rf package "$TARBALL"
              echo "should_publish=false" >> "$GITHUB_OUTPUT"
            else
              echo "ERROR: the built api-types differ from the published $CURRENT. Bump packages/api-types/package.json"
              diff packages/api-types/dist/index.d.ts package/dist/index.d.ts || true
              rm -rf package "$TARBALL"
              exit 1
            fi
          else
            echo "@createrington/api-types@$CURRENT not on Gitea, will publish"
            echo "should_publish=true" >> "$GITHUB_OUTPUT"
          fi
          echo "version=$CURRENT" >> "$GITHUB_OUTPUT"

      - name: Publish @createrington/api-types
        if: steps.api-types-check.outputs.should_publish == 'true'
        env:
          PACKAGES_TOKEN: ${{ secrets.PACKAGES_TOKEN }}
        run: |
          echo "${NPM_REGISTRY#https:}:_authToken=$PACKAGES_TOKEN" >> .npmrc
          pnpm --filter @createrington/api-types build
          pnpm --filter @createrington/api-types publish --no-git-checks
          echo "Published @createrington/api-types@${{ steps.api-types-check.outputs.version }}"
