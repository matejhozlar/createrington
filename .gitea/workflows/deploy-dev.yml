name: Deploy Dev

on:
  pull_request:
    types: [closed]
    branches: [dev]
  workflow_dispatch:
    inputs:
      reset_db:
        description: "Reset the database (drop + recreate + seed)"
        required: false
        default: "false"
        type: choice
        options:
          - "false"
          - "true"

jobs:
  deploy:
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.merged == true
    runs-on: hetzner
    env:
      INFISICAL_API_URL: ${{ secrets.INFISICAL_API_URL }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install pnpm
        run: npm install -g pnpm

      - name: Install dependencies
        run: pnpm install

      - name: Login to Infisical
        env:
          INFISICAL_CLIENT_ID: ${{ secrets.INFISICAL_CLIENT_ID }}
          INFISICAL_CLIENT_SECRET: ${{ secrets.INFISICAL_CLIENT_SECRET }}
        run: |
          TOKEN=$(pnpm exec infisical login \
            --method=universal-auth \
            --client-id="$INFISICAL_CLIENT_ID" \
            --client-secret="$INFISICAL_CLIENT_SECRET" \
            --plain --silent)
          echo "INFISICAL_TOKEN=$TOKEN" >> "$GITHUB_ENV"

      - name: Generate types, command docs, and deploy commands
        run: |
          pnpm exec infisical run --env=staging --command "pnpm generate:ci && pnpm generate-command-docs:json && pnpm generate-api-docs && pnpm deploy-commands"

      - name: Check for mod API changes
        id: spec-check
        run: |
          changed=false
          if [ "${{ github.event_name }}" != "pull_request" ]; then
            echo "Not a PR merge, skipping mod API spec check."
            echo "changed=$changed" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          BASE='${{ github.event.pull_request.base.sha }}'
          if git diff "$BASE"..HEAD --name-only -- '*.api-spec.ts' | grep -q .; then
            changed=true
          fi
          OLD_VERSION=$(git show "$BASE":mod-api/gradle.properties 2>/dev/null | grep '^version=' | cut -d'=' -f2 || echo "")
          NEW_VERSION=$(grep '^version=' mod-api/gradle.properties | cut -d'=' -f2)
          if [ "$OLD_VERSION" != "$NEW_VERSION" ]; then
            changed=true
          fi
          echo "changed=$changed" >> "$GITHUB_OUTPUT"

      - name: Setup JDK 21
        if: steps.spec-check.outputs.changed == 'true'
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: "temurin"

      - name: Setup Gradle
        if: steps.spec-check.outputs.changed == 'true'
        uses: gradle/actions/setup-gradle@v4.4.4
        with:
          gradle-version: "8.12"

      - name: Generate and publish mod API
        if: steps.spec-check.outputs.changed == 'true'
        run: |
          pnpm generate-mod-api
          cd mod-api
          VERSION=$(grep '^version=' gradle.properties | cut -d'=' -f2)
          JAR_URL="https://raw.githubusercontent.com/matejhozlar/maven/main/com/saunhardy/createrington-api/${VERSION}/createrington-api-${VERSION}.jar"
          if curl --silent --head --fail "$JAR_URL" > /dev/null 2>&1; then
            echo "ERROR: createrington-api:${VERSION} already published. Bump version in mod-api/gradle.properties"
            exit 1
          fi
          gradle publish
          cd ..
          git clone https://x-access-token:${{ secrets.MAVEN_REPO_TOKEN }}@github.com/matejhozlar/maven.git maven-repo
          cp -r mod-api/build/maven-publish/. maven-repo/
          cd maven-repo
          git config user.email "ci@create-rington.com"
          git config user.name "CI"
          git add .
          git diff --cached --quiet || git commit -m "publish createrington-api ${VERSION}"
          git push

      - name: Build
        run: |
          VITE_APP_VERSION="$(node -p 'require("./package.json").version')-dev.$(git rev-parse --short HEAD)" \
          VITE_API_URL=https://dev.createrington.com \
          VITE_BLUEMAP_URL=https://map-test.createrington.com \
          pnpm build

      - name: Deploy frontend
        run: |
          rm -rf /var/www/createrington-dev/*
          cp -r dist/public/* /var/www/createrington-dev/

      - name: Deploy backend
        run: |
          rm -rf /opt/createrington-dev/dist
          cp -r dist /opt/createrington-dev/dist
          cp package.json /opt/createrington-dev/package.json
          rm -rf /opt/createrington-dev/node_modules
          cp -r node_modules /opt/createrington-dev/node_modules
          mkdir -p /opt/createrington-dev/packages/server
          rm -rf /opt/createrington-dev/packages/server/node_modules
          cp -r packages/server/node_modules /opt/createrington-dev/packages/server/node_modules

      - name: Migrate database
        if: ${{ github.event.inputs.reset_db != 'true' }}
        run: |
          pnpm exec infisical run --env=staging --command 'PGPASSWORD="$DB_PASSWORD" pnpm db:migrate'

      - name: Reset database
        if: ${{ github.event.inputs.reset_db == 'true' }}
        run: |
          apt-get update && apt-get install -y postgresql-client > /dev/null 2>&1
          pnpm exec infisical run --env=staging --command '
            export PGPASSWORD="$DB_PASSWORD"
            psql -h "$DB_HOST" -U "$DB_USER" -d postgres -c "DROP DATABASE IF EXISTS $DB_DATABASE WITH (FORCE);"
            psql -h "$DB_HOST" -U "$DB_USER" -d postgres -c "CREATE DATABASE $DB_DATABASE;"
            pnpm db:migrate
            psql -h "$DB_HOST" -U "$DB_USER" -d "$DB_DATABASE" -f db/data/test-data.sql
          '

      - name: Sync runtime .env from Infisical
        run: |
          pnpm exec infisical export --env=staging --format=dotenv > /opt/createrington-dev/.env
          chmod 600 /opt/createrington-dev/.env

      - name: Fix permissions and trigger restart
        run: |
          rm -f /opt/createrington-dev/.maintenance
          chown -R 1000:988 /opt/createrington-dev
          chown -R 1000:988 /var/www/createrington-dev
          touch /opt/createrington-dev/.restart-trigger

      - name: Check if @createrington/api-types version changed
        id: api-types-check
        run: |
          REGISTRY="https://gitea.matejhoz.com/api/packages/createrington/npm/"
          CURRENT=$(node -p "require('./packages/api-types/package.json').version")
          PUBLISHED=$(npm view @createrington/api-types@$CURRENT version --registry=$REGISTRY 2>/dev/null || echo "")
          if [ -n "$PUBLISHED" ]; then
            echo "@createrington/api-types@$CURRENT already on Gitea, skipping publish"
            echo "should_publish=false" >> "$GITHUB_OUTPUT"
          else
            echo "@createrington/api-types@$CURRENT not on Gitea, will publish"
            echo "should_publish=true" >> "$GITHUB_OUTPUT"
          fi
          echo "version=$CURRENT" >> "$GITHUB_OUTPUT"

      - name: Publish @createrington/api-types
        if: steps.api-types-check.outputs.should_publish == 'true'
        env:
          PACKAGES_TOKEN: ${{ secrets.PACKAGES_TOKEN }}
        run: |
          echo "//gitea.matejhoz.com/api/packages/createrington/npm/:_authToken=$PACKAGES_TOKEN" >> .npmrc
          pnpm --filter @createrington/api-types build
          pnpm --filter @createrington/api-types publish --no-git-checks
          echo "Published @createrington/api-types@${{ steps.api-types-check.outputs.version }}"
