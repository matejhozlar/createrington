services:
  minecraft:
    image: itzg/minecraft-server:java21
    container_name: createrington_mc
    tty: true
    stdin_open: true
    ports:
      - "25565:25565"
      - "${MC_RCON_PORT:-25575}:25575"
    environment:
      EULA: "TRUE"
      TYPE: "NEOFORGE"
      VERSION: "1.21.1"
      NEOFORGE_VERSION: "${MC_NEOFORGE_VERSION:-21.1.222}"
      MEMORY: "${MC_MEMORY:-4G}"
      # Auto-install the Createrington dev mods on first boot. itzg downloads
      # each CurseForge file in the list via the API (needs CF_API_KEY). The
      # list mirrors mc/modpack/manifest.json (the importable pack export).
      CF_API_KEY: "${CURSEFORGE_API_KEY:-}"
      CURSEFORGE_FILES: "@/modpack/curseforge-files.txt"
      # Online mode mirrors production (real account auth + UUIDs). Set to
      # FALSE locally if you need to join without a premium account.
      ONLINE_MODE: "${MC_ONLINE_MODE:-TRUE}"
      ENABLE_RCON: "true"
      RCON_PASSWORD: "${MC_RCON_PASSWORD:-dev-rcon}"
      RCON_PORT: "25575"
      OVERRIDE_SERVER_PROPERTIES: "true"
    volumes:
      - ./data:/data
      - ./modpack:/modpack:ro
      # Pre-baked mod config so the dev mods point at the host backend out of
      # the box (mods default to 127.0.0.1:5000; the backend is on host:5001).
      # Mounted as a directory so the mods' config library can rewrite files;
      # only the Createrington mod configs are tracked (see config/.gitignore).
      - ./config:/data/config
    healthcheck:
      test: ["CMD", "mc-health"]
      start_period: 5m
      interval: 30s
      timeout: 10s
      retries: 5
